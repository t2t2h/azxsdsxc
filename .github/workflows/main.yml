name: Build AflatoonSuite dylib

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install ldid make

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build
        run: gmake FINALPACKAGE=1

      - name: Show output
        run: find .theos -name "*.dylib"

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: AflatoonSuite-dylib
          path: .theos/obj/AflatoonSuite.dylib
